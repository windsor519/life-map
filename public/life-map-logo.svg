<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">Life Map logo</title>
  <desc id="desc">A warm lantern beacon shining light over a winding life path inside a map pin.</desc>
  <defs>
    <radialGradient id="night" cx="40" cy="24" r="105" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1f2a6d"/>
      <stop offset="0.48" stop-color="#172554"/>
      <stop offset="1" stop-color="#070817"/>
    </radialGradient>
    <linearGradient id="pin" x1="24" y1="12" x2="108" y2="116" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.44" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="beam" x1="64" y1="26" x2="64" y2="112" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff7ad" stop-opacity="0.95"/>
      <stop offset="0.58" stop-color="#fde68a" stop-opacity="0.48"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="route" x1="35" y1="93" x2="93" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fef3c7"/>
      <stop offset="0.48" stop-color="#fde047"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <filter id="softGlow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="sunGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="128" height="128" rx="30" fill="url(#night)"/>
  <path d="M64 8c24.85 0 45 19.08 45 42.62C109 82.5 64 120 64 120S19 82.5 19 50.62C19 27.08 39.15 8 64 8Z" fill="url(#pin)"/>
  <path d="M64 25 101 104H27L64 25Z" fill="url(#beam)" opacity="0.88"/>
  <circle cx="64" cy="34" r="17" fill="#facc15" filter="url(#sunGlow)"/>
  <circle cx="64" cy="34" r="9" fill="#fff7ed"/>
  <path d="M64 13v8M64 47v8M43 34h8M77 34h8M49.2 19.2l5.7 5.7M73.1 43.1l5.7 5.7M78.8 19.2l-5.7 5.7M54.9 43.1l-5.7 5.7" stroke="#fff7ad" stroke-width="4" stroke-linecap="round" opacity="0.9"/>
  <path d="M34 91c8.5-15.5 30.5-4 37.5-20.5 5.8-13.7-13.7-17.1-6.9-27.7 5.2-8.1 17.4-7.9 25.4-3.8" fill="none" stroke="#fff7ad" stroke-width="14" stroke-linecap="round" opacity="0.24"/>
  <path d="M34 91c8.5-15.5 30.5-4 37.5-20.5 5.8-13.7-13.7-17.1-6.9-27.7 5.2-8.1 17.4-7.9 25.4-3.8" fill="none" stroke="url(#route)" stroke-width="7" stroke-linecap="round" stroke-dasharray="1 14" filter="url(#softGlow)"/>
  <circle cx="34" cy="91" r="7.5" fill="#fbbf24" stroke="#fff7ed" stroke-width="3"/>
  <circle cx="66" cy="69" r="6" fill="#fde047" stroke="#fff7ed" stroke-width="2.6"/>
  <circle cx="90" cy="39" r="7" fill="#ffffff" stroke="#fde68a" stroke-width="3"/>
  <path d="M37 105h54" stroke="#fff7ed" stroke-width="4" stroke-linecap="round" opacity="0.35"/>
</svg>

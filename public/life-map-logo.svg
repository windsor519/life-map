<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">Life Map logo</title>
  <desc id="desc">A glowing path winding through a four-season map pin.</desc>
  <defs>
    <linearGradient id="sky" x1="18" y1="10" x2="112" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff7a59"/>
      <stop offset="0.45" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="path" x1="27" y1="91" x2="98" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fef3c7"/>
      <stop offset="0.42" stop-color="#a7f3d0"/>
      <stop offset="1" stop-color="#bae6fd"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="128" height="128" rx="30" fill="#070817"/>
  <path d="M64 9c24.3 0 44 18.8 44 42 0 31.5-44 68-44 68S20 82.5 20 51C20 27.8 39.7 9 64 9Z" fill="url(#sky)"/>
  <path d="M37 87c11-16 44 3 54-17 8-16-20-20-12-33 4.4-7.2 14.5-7.7 21-5" fill="none" stroke="url(#path)" stroke-width="8" stroke-linecap="round" stroke-dasharray="1 15" filter="url(#glow)"/>
  <circle cx="38" cy="88" r="8" fill="#fbbf24" stroke="#fff7ed" stroke-width="3"/>
  <circle cx="80" cy="61" r="7" fill="#34d399" stroke="#ecfeff" stroke-width="3"/>
  <circle cx="99" cy="32" r="8" fill="#7dd3fc" stroke="#eff6ff" stroke-width="3"/>
  <path d="M46 39h36M47 51h34M48 63h20" stroke="rgba(255,255,255,.32)" stroke-width="4" stroke-linecap="round"/>
</svg>
